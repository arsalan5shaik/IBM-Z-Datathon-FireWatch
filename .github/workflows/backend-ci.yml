name: Backend CI

on:
  push:
    branches: [main, 'JS_feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --python ${{ matrix.python }}
      - name: Unit, integration and contract tests (mock HTTP only)
        run: uv run --no-sync python -m pytest
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Format check
        run: uv run --no-sync python -m ruff format --check .
      - name: Process startup and HTTP smoke
        run: uv run --no-sync python scripts/smoke.py
      - name: Fixture forecast HTTP smoke
        run: uv run --no-sync python scripts/smoke.py --fixtures
