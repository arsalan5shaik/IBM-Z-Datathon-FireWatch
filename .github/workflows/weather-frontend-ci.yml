name: Weather frontend checks
on:
  push:
    branches: ['JS_feat/weather-inference']
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/weather-frontend-ci.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
