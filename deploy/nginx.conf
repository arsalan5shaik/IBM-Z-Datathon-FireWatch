worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
    # No AIO is used; avoid unsupported io_setup calls under s390x QEMU.
    worker_aio_requests 0;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker DNS resolves the service again after backend replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /healthz { access_log off; return 200 'ok\n'; }
        # No authenticated gateway is included. Block all chat path variants.
        location ~* ^/api/v1/chat { return 403; }
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-FireWatch-Chat-Auth "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
        location /assets/ { try_files $uri =404; }
        location /data/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
